<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="unsafe-url">
  <meta name="robots" content="noindex,nofollow">
  <title>CTM SOL / USDC Terminal</title>
  <style>
    :root {
      color-scheme: dark;
      background: #080a0c;
      color: #f2f5f7;
      font-family: "Segoe UI Variable", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0c;
    }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .gateway-bar {
      position: relative;
      z-index: 3;
      display: flex;
      min-height: 38px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 5px max(10px, env(safe-area-inset-right)) 5px max(10px, env(safe-area-inset-left));
      border-bottom: 1px solid #252c32;
      background: #0d1013;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    }
    .frame {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      display: block;
      background: #080a0c;
    }
    .fallback {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      color: #8d98a3;
      font-size: 10px;
    }
    .fallback a {
      flex: 0 0 auto;
      min-height: 27px;
      padding: 4px 9px;
      border: 1px solid #343e47;
      border-radius: 4px;
      background: #171c21;
      color: #d7dde2;
      font-weight: 700;
      text-decoration: none;
    }
    .fallback span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .live-status {
      display: flex;
      min-width: 0;
      gap: 8px;
      align-items: center;
      color: #f2b84b;
      font-size: 10px;
      font-weight: 800;
      pointer-events: none;
    }
    .live-status.live {
      color: #21c99a;
    }
    .live-status.offline {
      color: #ff697d;
    }
    .live-status .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    .live-status .detail {
      overflow: hidden;
      color: #8d98a3;
      font-size: 10px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 520px) {
      .gateway-bar {
        min-height: calc(46px + env(safe-area-inset-top));
        align-items: center;
        gap: 6px;
        padding-top: env(safe-area-inset-top);
      }
      .live-status {
        gap: 6px;
      }
      .live-status .detail {
        display: none;
      }
      .fallback span { display: none; }
    }
  </style>
</head>
<body>
  <div class="gateway-bar">
    <div id="live-status" class="live-status checking" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="live-status-label">CHECKING &middot; &#25509;&#32154;&#30906;&#35469;&#20013;</span>
      <span id="live-status-detail" class="detail">SOL / USDC terminal connection</span>
    </div>
    <div class="fallback">
      <span>Updated 2026-08-15T00:03:27Z / adaptive trading terminal</span>
      <a href="https://shoot-cafe-compact-reduced.trycloudflare.com/?public=github">Open</a>
    </div>
  </div>
  <iframe id="ctm-frame" class="frame" src="https://shoot-cafe-compact-reduced.trycloudflare.com/?public=github" title="CTM Public Monitor"></iframe>
  <script>
    window.CTM_MONITOR = {
      dashboardUrl: "https://shoot-cafe-compact-reduced.trycloudflare.com/?public=github",
      baseUrl: "https://shoot-cafe-compact-reduced.trycloudflare.com",
      generatedAt: "2026-08-15T00:03:27Z",
      stableUrl: "https://expresspath.github.io/crypto/",
      authMode: "public-viewer+tokenless-funding",
      tabForwarding: "v1",
      realtimeIndicator: "v3",
      gatewayUi: "adaptive-terminal-v1",
      optionsRouting: "eager-hash-v1",
      ppoUi: "continuous-v2",
      scriptRevision: "1495d0571d68",
      charsetMode: "ascii-utf8-nobom-v1"
    };
    const params = new URLSearchParams(window.location.search);
    const requestedTab = params.get("funding") === "1"
      ? "funding"
      : params.get("options") === "1"
        ? "options"
      : params.get("miner") === "1"
        ? "options"
        : params.get("tab") || window.location.hash.slice(1);
    const optionsView = requestedTab === "options" || requestedTab === "miner";
    if (["options", "miner", "funding"].includes(requestedTab)) {
      const normalizedTab = requestedTab === "miner" ? "options" : requestedTab;
      const targetUrl = window.CTM_MONITOR.dashboardUrl + "#" + normalizedTab;
      document.querySelector("#ctm-frame").src = targetUrl;
      document.querySelector(".fallback a").href = targetUrl;
    }

    const liveStatus = document.querySelector("#live-status");
    const liveStatusLabel = document.querySelector("#live-status-label");
    const liveStatusDetail = document.querySelector("#live-status-detail");
    let healthRequest = null;

    function healthClock() {
      return new Date().toLocaleTimeString("ja-JP", { hour12: false });
    }

    function showRealtimeState(health) {
      if (optionsView) {
        const reachable = Boolean(health && health.venue === "Derive" && health.mode === "SHADOW");
        const healthy = reachable && Boolean(health.healthy);
        const assets = reachable && health.assets ? health.assets : {};
        const healthyCollectors = [assets.BTC, assets.ETH].filter((asset) => asset && asset.healthy).length;
        liveStatus.classList.toggle("live", healthy);
        liveStatus.classList.toggle("offline", !reachable);
        liveStatus.classList.remove("checking");
        liveStatusLabel.textContent = healthy
          ? "DERIVE OPTIONS \u00B7 SHADOW LIVE"
          : reachable
            ? "DERIVE OPTIONS \u00B7 SHADOW DEGRADED"
            : "OPTIONS NOT LIVE";
        liveStatusDetail.textContent = reachable
          ? healthyCollectors + "/2 collectors \u00B7 \u53D6\u5F15\u9001\u4FE1 OFF \u00B7 \u78BA\u8A8D " + healthClock()
          : "Option Trade telemetry unavailable \u00B7 \u78BA\u8A8D " + healthClock();
        return;
      }
      const connected = Boolean(health && health.ok && health.realtime);
      const ppo = health && health.ppo ? health.ppo : {};
      const operational = connected && Boolean(health.botRunning && ppo.actionFresh);
      liveStatus.classList.toggle("live", operational);
      liveStatus.classList.toggle("offline", !connected);
      liveStatus.classList.remove("checking");
      if (operational) {
        const target = Number(ppo.targetBaseSharePct);
        liveStatusLabel.textContent = "BOT LIVE \u00B7 \u5B9F\u904B\u7528";
        liveStatusDetail.textContent =
          (ppo.forecastModelVersion || (Number(ppo.activeModelCount || 0) + " models")) +
          (Number.isFinite(target) ? " \u00B7 SOL\u76EE\u6A19 " + target.toFixed(3) + "%" : "") +
          " \u00B7 \u78BA\u8A8D " + healthClock();
      } else if (connected) {
        liveStatusLabel.textContent = health.botRunning
          ? "BOT HOLD \u00B7 \u884C\u52D5\u66F4\u65B0\u5F85\u3061"
          : "BOT STOPPED";
        liveStatusDetail.textContent =
          "GitHub\u30E2\u30CB\u30BF\u30FC\u63A5\u7D9A\u4E2D \u00B7 \u78BA\u8A8D " +
          healthClock();
      } else {
        liveStatusLabel.textContent = "NOT LIVE \u00B7 \u30EA\u30A2\u30EB\u30BF\u30A4\u30E0\u60C5\u5831\u3067\u306F\u3042\u308A\u307E\u305B\u3093";
        liveStatusDetail.textContent = "PC\u307E\u305F\u306FCloudflare\u30C8\u30F3\u30CD\u30EB\u306B\u63A5\u7D9A\u3067\u304D\u307E\u305B\u3093 \u00B7 \u78BA\u8A8D " + healthClock();
      }
    }

    async function checkRealtime() {
      if (healthRequest) return healthRequest;
      healthRequest = (async () => {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 8000);
        try {
          const statusPath = optionsView ? "/api/options/status?public=github&_r=" : "/api/health?_r=";
          const response = await fetch(
            window.CTM_MONITOR.baseUrl + statusPath + Date.now(),
            { cache: "no-store", mode: "cors", signal: controller.signal }
          );
          const health = response.ok ? await response.json() : null;
          showRealtimeState(health);
        } catch {
          showRealtimeState(null);
        } finally {
          window.clearTimeout(timeout);
        }
      })();
      try {
        await healthRequest;
      } finally {
        healthRequest = null;
      }
    }

    checkRealtime();
    window.setInterval(checkRealtime, 15000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) checkRealtime();
    });
  </script>
</body>
</html>
